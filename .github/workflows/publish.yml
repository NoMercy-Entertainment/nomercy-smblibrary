# Publish NoMercy.SMBLibrary to nuget.org with Trusted Publishing: no stored API
# key. nuget.org trusts this repository and this file name (publish.yml); the
# job trades a GitHub OIDC token for a one-hour key right before the push.
#
# Release: bump <Version> in src/SMBLibrary/SMBLibrary.csproj, commit, then push
# a tag v<Version> (e.g. v1.5.7-nomercy.1). The tag must match the version.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets nuget.org verify this run
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/SMBLibrary/SMBLibrary.csproj -c Release -o out --nologo

      # The package must carry both assemblies: Utilities is referenced privately
      # and a plain pack leaves it out, which breaks every SMB call at runtime.
      - name: Check package contents and version
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(ls out/NoMercy.SMBLibrary.*.nupkg)
          unzip -l "$pkg" | grep -q 'lib/netstandard2.0/NoMercy.SMBLibrary.dll'
          unzip -l "$pkg" | grep -q 'lib/netstandard2.0/NoMercy.SMBLibrary.Utilities.dll'
          version=$(unzip -p "$pkg" NoMercy.SMBLibrary.nuspec | sed -n 's:.*<version>\(.*\)</version>.*:\1:p')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          echo "package ${pkg}, version ${version}"

      - name: NuGet login (OIDC to a one-hour key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }} # nuget.org profile name, same as the media server

      - name: Push
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
